name: DailyForge Morning Briefing

on:
  schedule:
    # 07:00 AM Asia/Kolkata (IST) = 01:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (validate briefing without sending email)'
        type: boolean
        required: false
        default: false

jobs:
  morning-briefing:
    name: Deliver Daily DSA Briefing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Runtime Dependencies
        run: |
          pip install pytz

      - name: Validate Secrets Presence
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          if [ -z "$SMTP_EMAIL" ] || [ -z "$SMTP_APP_PASSWORD" ] || [ -z "$RECIPIENT_EMAIL" ]; then
            echo "::error::Required secrets (SMTP_EMAIL, SMTP_APP_PASSWORD, RECIPIENT_EMAIL) are not configured."
            exit 1
          fi
          echo "SMTP secrets validated."

      - name: Dispatch Morning Briefing
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FRONTEND_URL: 'https://geeky-rish.github.io/DailyForge'
          CHALLENGE_START_DATE: '2024-01-01'
          TIMEZONE: 'Asia/Kolkata'
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python backend/scripts/daily_briefing.py $FLAGS
