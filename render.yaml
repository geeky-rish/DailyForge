services:
  - type: web
    name: dailyforge-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements-prod.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dailyforge-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://geeky-rish.github.io/DailyForge
      - key: GITHUB_REDIRECT_URI
        value: https://dailyforge-backend-kwti.onrender.com/auth/github/callback
      - key: AUTHORIZED_GITHUB_USERNAME
        value: geeky-rish
      - key: GITHUB_README_REPO
        value: geeky-rish/geeky-rish
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: QUESTIONS_PER_DAY
        value: "2"
      - key: CHALLENGE_START_DATE
        value: "2024-01-01"
      - key: SECRET_KEY
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WRITE_TOKEN
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: EMAIL_DRY_RUN
        value: "false"

databases:
  - name: dailyforge-db
    databaseName: dailyforge
    user: dailyforge_user
    plan: free
    region: oregon
